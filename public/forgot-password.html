<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Moisdes Vien Admin</title>
<link rel="icon" href="/logo.avif">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Heebo', sans-serif; background: #16294d;
    background-image: linear-gradient(180deg, #1e3766 0%, #16294d 100%);
    color: #eaf2fb;
  }
  .card {
    width: 100%; max-width: 360px; background: #ffffff;
    border: 1px solid #dbe4ee; border-radius: 8px; padding: 2.5rem 2rem;
    box-shadow: 0 10px 40px rgba(13, 32, 60, .35);
  }
  .card img { height: 48px; display: block; margin: 0 auto 1.5rem; }
  h1 { font-size: 1.15rem; font-weight: 700; text-align: center; margin: 0 0 .6rem; color: #1c2f4d; }
  p.lead { font-size: .85rem; color: #75879c; text-align: center; margin: 0 0 1.5rem; }
  label { font-size: .82rem; color: #75879c; display: block; margin-bottom: .35rem; }
  input {
    width: 100%; padding: .6rem .75rem; margin-bottom: 1.1rem; border-radius: 5px;
    border: 1.5px solid #dbe4ee; background: #f2f6fb; color: #1c2f4d;
    font-family: inherit; font-size: .95rem;
  }
  input:focus { outline: none; border-color: #25a9ea; background: #fff; }
  button {
    width: 100%; padding: .7rem; border: none; border-radius: 5px; cursor: pointer;
    background: #25a9ea; color: #0d2b45; font-weight: 700; font-size: .95rem; font-family: inherit;
  }
  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 1.2rem; font-size: .82rem; margin-top: 1rem; text-align: center; }
  .msg.err { color: #c0392b; }
  .msg.ok { color: #2e7d4f; }
  .back-link { display: block; text-align: center; margin-top: 1.2rem; font-size: .82rem; color: #75879c; text-decoration: none; }
  .back-link:hover { color: #25a9ea; }
</style>
</head>
<body>
<form class="card" id="forgot-form">
  <img src="/logo.avif" alt="Moisdes Vien">
  <h1>Forgot your password?</h1>
  <p class="lead">Enter your email and we'll send you a link to reset it.</p>
  <label for="email">Email</label>
  <input type="email" id="email" required autocomplete="username">
  <button type="submit" id="submit-btn">Send reset link</button>
  <div class="msg" id="msg"></div>
  <a class="back-link" href="/login.html">Back to login</a>
</form>

<script src="/shared-config.js"></script>
<script src="/moisdes-api.js"></script>
<script>
  const form = document.getElementById('forgot-form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    msg.textContent = '';
    msg.className = 'msg';
    try {
      const { message } = await window.MOISDES.api.post('/api/forgot-password', {
        email: document.getElementById('email').value.trim(),
      });
      msg.textContent = message || 'If that email has an account, a reset link is on its way.';
      msg.className = 'msg ok';
      form.querySelector('input').disabled = true;
      btn.disabled = true;
    } catch (err) {
      msg.textContent = err.message || 'Something went wrong.';
      msg.className = 'msg err';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
