name = "moisdes-worker"
main = "index.js"
compatibility_date = "2024-01-01"

# Frontend is served directly by this Worker now (Cloudflare's Workers
# Static Assets) instead of a separate Pages project — one deploy target
# for both the site and the API, so "push to this repo" is the whole
# deploy story. Requests matching a file in public/ are served straight
# from there, no Worker code runs; anything else (chiefly /api/*) falls
# through to this Worker's fetch handler below, same as before.
[assets]
directory = "./public"
not_found_handling = "404-page"
# Required for the Worker to be able to call env.ASSETS.fetch() itself
# (handleHomePage in index.js does this to get the static index.html it
# then injects the server-rendered mosaic into) — without this binding
# declared, env.ASSETS doesn't exist and that handler throws.
binding = "ASSETS"
# Only "/" is routed through the Worker first (so it can inject the
# server-rendered mosaic) — every other static file is still served
# directly by Cloudflare's edge with no Worker code running, same as
# before.
run_worker_first = ["/"]

[[d1_databases]]
binding = "DB"
database_name = "moisdes-db"
database_id = "45bea6a4-108d-4bfb-8baf-5fa22b2a5bfd"

[[r2_buckets]]
binding = "R2"
bucket_name = "moisdes-media"
