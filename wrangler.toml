name = "moisdes-worker"
main = "index.js"
compatibility_date = "2024-01-01"

# Frontend is served directly by this Worker now (Cloudflare's Workers
# Static Assets) instead of a separate Pages project — one deploy target
# for both the site and the API, so "push to this repo" is the whole
# deploy story. Requests matching a file in public/ are served straight
# from there, no Worker code runs; anything else (chiefly /api/*) falls
# through to this Worker's fetch handler below, same as before.
[assets]
directory = "./public"
not_found_handling = "404-page"
# Lets the Worker call env.ASSETS.fetch() itself if needed later — kept,
# but currently unused: run_worker_first (which would have routed "/"
# through the Worker first, for the home-page SSR experiment) was
# removed. Two deploys in a row of a batch that included it never went
# live, and that's the one config change in those commits not already
# proven to deploy cleanly earlier in this project — pulled it out to
# isolate whether IT was the blocker, rather than guess further blind.
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "moisdes-db"
database_id = "45bea6a4-108d-4bfb-8baf-5fa22b2a5bfd"

[[r2_buckets]]
binding = "R2"
bucket_name = "moisdes-media"
